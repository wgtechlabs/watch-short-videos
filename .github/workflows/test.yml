name: Tests and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m unittest discover -s tests -v

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: unittest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Plan release
        id: plan
        uses: wgtechlabs/release-build-flow-action@6df9cb42c24c296d902150d051a0b6be4422cccc # v1.8.0
        with:
          initial-version: "0.2.0"
          dry-run: true
          changelog-enabled: false
          sync-version-files: false
      - name: Update plugin versions
        if: steps.plan.outputs.version-bump-type != 'none'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          for manifest in plugin.json .codex-plugin/plugin.json; do
            jq --arg version "$RELEASE_VERSION" '.version = $version' "$manifest" > "$RUNNER_TEMP/plugin.json"
            mv "$RUNNER_TEMP/plugin.json" "$manifest"
            git add "$manifest"
          done
      - name: Publish release
        if: steps.plan.outputs.version-bump-type != 'none'
        uses: wgtechlabs/release-build-flow-action@6df9cb42c24c296d902150d051a0b6be4422cccc # v1.8.0
        with:
          planned-version: ${{ steps.plan.outputs.version }}
          planned-version-tag: ${{ steps.plan.outputs.version-tag }}
          planned-version-bump-type: ${{ steps.plan.outputs.version-bump-type }}
          planned-previous-version: ${{ steps.plan.outputs.previous-version }}
          sync-version-files: true
          version-file-paths: pyproject.toml
          changelog-path: ./CHANGELOG.md
          commit-changelog: true
          create-release: true
